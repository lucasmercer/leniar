<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0d14"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#lgrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Circuit tracks -->
  <path d="M14 20 L24 20 L30 14 L44 14" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="44" cy="14" r="3" fill="#00d2ff" opacity="0.8"/>
  <path d="M50 44 L40 44 L34 50 L20 50" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="20" cy="50" r="3" fill="#2563eb" opacity="0.8"/>
  <!-- Tech Monogram L -->
  <path d="M22 18 L22 46 L42 46" fill="none" stroke="url(#lgrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="22" cy="18" r="3" fill="#ffffff"/>
  <circle cx="42" cy="46" r="3" fill="#ffffff"/>
</svg>
